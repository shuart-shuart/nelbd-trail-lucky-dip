name: Validate lucky dip backend
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/staff-authorized-draw]
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run build

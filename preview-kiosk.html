<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NELBD Trail Lucky Dip — Safe Preview</title>
<style>
@font-face{font-family:NEL;src:url('/fonts/NELROUNDED-SemiBold.otf')}@font-face{font-family:DM;src:url('/fonts/DMSans-Regular.ttf');font-weight:400}@font-face{font-family:DM;src:url('/fonts/DMSans-Bold.ttf');font-weight:500 900}
:root{--violet:#270342;--purple:#7716B5;--pink:#FF8DC6}*{box-sizing:border-box}body{margin:0;background:var(--violet);color:#fff;font-family:DM,sans-serif;font-weight:400}h1{font-family:NEL,sans-serif;font-weight:600;font-size:clamp(2rem,7vw,3.5rem);line-height:1.1;margin:12px 0}h2,p{margin:10px 0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.wrap{max-width:640px;min-height:100dvh;margin:auto;padding:clamp(16px,4vw,32px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.panel{position:relative;width:100%;padding:clamp(20px,5vw,36px);border:4px solid var(--purple);outline:2px solid #7716B566;outline-offset:-9px;border-radius:28px;background:var(--pink);color:var(--violet)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.lead{font-size:clamp(17px,4vw,23px)}.btn{border:2px solid var(--purple);border-radius:16px;background:var(--pink);color:var(--violet);font-weight:700;padding:17px 22px;min-height:56px;width:100%;margin-top:14px}.btn.dark{background:var(--violet);color:var(--pink)}.btn:disabled{opacity:.5;cursor:not-allowed}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.choices button{border:2px solid var(--purple);border-radius:14px;background:#fff2;color:var(--violet);padding:14px 8px;min-height:64px;font-weight:700}.choices button.selected{background:var(--violet);color:var(--pink)}label{display:block;text-align:left;font-weight:700;margin-top:18px}input{display:block;width:100%;min-height:52px;margin-top:6px;border:2px solid var(--purple);border-radius:12px;background:#fff8;padding:12px;color:var(--violet);font-size:18px}.hint{font-size:12px;text-align:left}.draw{width:min(76vw,36dvh,290px);height:min(76vw,36dvh,290px);border-radius:50%;background:var(--pink);border:8px solid var(--purple);box-shadow:inset 0 0 0 8px var(--pink),inset 0 0 0 10px var(--purple);color:var(--violet);font-size:clamp(22px,6vw,36px);font-weight:700;line-height:1.05;display:flex;align-items:center;justify-content:center;margin:24px auto}.close{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--purple);background:var(--violet);color:var(--pink);font-size:28px;line-height:1}.prize{border-top:3px dashed #7716B555;border-bottom:3px dashed #7716B555;margin:20px 0;padding:30px 4px;font-size:clamp(24px,6vw,34px);font-weight:700}.demo{position:fixed;left:10px;bottom:10px;background:#fff;color:var(--violet);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;z-index:5;box-shadow:0 2px 12px #0004}.footer{margin-top:22px;color:#ff8dc6b3;font-size:12px}.error{color:#9d1236;font-size:13px;font-weight:700}.hidden{display:none}@media(max-height:650px){.wrap{padding:12px}.panel{padding:18px}.draw{width:min(66vw,32dvh,240px);height:min(66vw,32dvh,240px)}}
</style></head><body><div class="demo">DESIGN PREVIEW ONLY · NO REAL DRAWS OR DATA</div><main id="app" class="wrap" aria-live="polite"></main>
<script>
const app=document.getElementById('app');let step='welcome',site='PDD',nickname='',mobile='',timer=null,seconds=180;
function clearTimer(){if(timer){clearInterval(timer);timer=null}}
function reset(){clearTimer();step='welcome';nickname='';mobile='';render()}
function next(s){clearTimer();step=s;render()}
function render(){if(step==='welcome'){app.innerHTML='<div class="eyebrow">New Everyday Life, By Design</div><h1>Trail Lucky Dip</h1><p class="lead">Ready for a little surprise?</p><div class="panel"><div class="eyebrow">Select your trail location</div><div class="choices"><button id="pdd" class="'+(site==='PDD'?'selected':'')+'">Innovation Hub</button><button id="ps" class="'+(site==='PS'?'selected':'')+'">Impact Hub</button></div><button class="btn dark" id="start">START →</button></div><div class="footer">Explore · Discover · Celebrate</div>';document.getElementById('pdd').onclick=()=>{site='PDD';render()};document.getElementById('ps').onclick=()=>{site='PS';render()};document.getElementById('start').onclick=()=>next('details')}
else if(step==='details'){app.innerHTML='<div class="panel"><div class="eyebrow">Step 1 of 2 · '+(site==='PDD'?'Innovation Hub':'Impact Hub')+'</div><h1>Let\'s get your prize.</h1><form id="form"><label for="nick">Nickname<input id="nick" maxlength="40" autocomplete="off" placeholder="e.g. Alex" required></label><label for="mobile">Singapore mobile number<input id="mobile" inputmode="numeric" type="tel" maxlength="8" placeholder="81234567" required></label><p class="hint">8 digits, starting with 8 or 9</p><p class="hint">Demo only. No information is saved or sent.</p><p class="error" id="err"></p><button class="btn dark" type="submit">CONTINUE →</button></form></div>';document.getElementById('nick').value=nickname;document.getElementById('mobile').value=mobile;document.getElementById('form').onsubmit=e=>{e.preventDefault();nickname=document.getElementById('nick').value.trim();mobile=document.getElementById('mobile').value;if(!nickname||! /^[89][0-9]{7}$/.test(mobile)){document.getElementById('err').textContent='Enter a nickname and a valid 8-digit Singapore mobile number.';return}next('draw')}}
else if(step==='draw'){app.innerHTML='<div class="eyebrow">Step 2 of 2 · Trail Lucky Dip</div><h1 id="ready"></h1><p class="lead" style="color:var(--pink)">One tap. One surprise.</p><button class="draw" id="draw" aria-label="Tap to reveal a demo prize">TAP HERE<br>TO DRAW</button><div class="footer">'+site+' · DEMO MODE</div>';document.getElementById('ready').textContent='Ready, '+nickname+'?';document.getElementById('draw').onclick=()=>next('result')}
else if(step==='result'){seconds=180;app.innerHTML='<div class="panel"><button class="close" id="close" aria-label="Close result and return to welcome">×</button><div class="eyebrow" style="padding-right:48px;text-align:left">New Everyday Life, By Design</div><h1>YOU\'VE WON!</h1><div class="eyebrow">Trail Reward Confirmed</div><div class="prize">Sample Trail Reward<br><span style="font-size:14px;font-weight:400">Illustrative prize — not awarded</span></div><p>Show this screen to our booth crew.</p><p class="hint" style="text-align:center">Resetting in <span id="count">180</span>s</p></div>';document.getElementById('close').onclick=reset;timer=setInterval(()=>{seconds--;const el=document.getElementById('count');if(el)el.textContent=seconds;if(seconds<=0)reset()},1000)}}
render();
</script></body></html>
